[project]
name = "cdp-use"
version = "1.4.5"
description = "Type safe generator/client library for CDP"
authors = [{ name = "Browser Use" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "idna>=3.15",
    "typing-extensions>=4.12.2",
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/browser-use/cdp-use"
Repository = "https://github.com/browser-use/cdp-use"
Issues = "https://github.com/browser-use/cdp-use/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["build==1.5.0", "ruff==0.16.0"]

[tool.hatch.build]
include = ["cdp_use/**/*.py", "cdp_use/py.typed"]
exclude = ["cdp_use/generator/*.py"]

[tool.ruff]
exclude = [".git", "__pycache__", "dist", "build"]

[tool.ruff.lint]
# Preserve the pre-0.16 default rule set instead of inheriting versioned defaults.
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Generated CDP code uses wildcard imports by design
"cdp_use/cdp/**/*.py" = ["F403", "F811"]
